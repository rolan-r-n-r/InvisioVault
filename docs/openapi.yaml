openapi: 3.0.3
info:
  title: InvisioVault REST API
  description: |
    Production REST API for InvisioVault: secure file hiding via V6 Matrix (3,2) coset steganography with 10-round Feistel permutation, interleaved Reed-Solomon RS(255, 223), automatic multi-engine carrier extraction (V1–V6), universal polyglot generation, and stealth QR code embedding.
  version: 2.0.1
  contact:
    name: Rolan (RNR)
    email: rolanlobo901@gmail.com
    url: https://rolan-rnr.netlify.app/
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://invisiovault-backend.onrender.com/api
    description: Production Render API
  - url: http://localhost:5000/api
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health Check
      description: Returns API blueprint health status. Exempt from rate limiting. Note that container orchestrators may also query the root service probe at `GET /`.
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: InvisioVault API is running

  /calculate-capacity-v6:
    post:
      summary: Calculate V6 Steganographic Capacity
      description: Computes exact raw payload capacity, pre-RS stream budget, RS block counts, and available triplets under V6 Matrix (3,2) coset coding from carrier image header metadata without full image decoding.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Carrier image (PNG, JPG, BMP)
      responses:
        '200':
          description: Calculated V6 capacity metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCapacityBytes:
                    type: integer
                    example: 1382400
                  totalCapacityFormatted:
                    type: string
                    example: 1.32 MB
                  engine:
                    type: string
                    example: v6
                  v6_details:
                    type: object
                    properties:
                      carrier_pixels:
                        type: integer
                        example: 2073600
                      available_channels:
                        type: integer
                        example: 6220344
                      available_triplets:
                        type: integer
                        example: 2073448
                      max_raw_payload_capacity:
                        type: integer
                        example: 432360
                      rs_block_count:
                        type: integer
                        example: 1938
                      interleave_k:
                        type: integer
                        example: 4
        '400':
          description: Invalid image or missing file

  /hide-v6:
    post:
      summary: Hide File in Image (V6 Advanced Steganography)
      description: Conceals a file or text payload into carrier image pixels using Matrix (3,2) coset syndrome coding, 10-round balanced Feistel channel permutation, dynamic-group interleaved Reed-Solomon RS(255, 223), and 57-byte authenticated headers. Supports Encrypted Mode (PBKDF2 600k + Fernet) and Plain Mode (CRC-32 + SHA-256 integrity).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Host carrier image (PNG, JPG, BMP). Max 10 MB, up to 10 megapixels.
                file:
                  type: string
                  format: binary
                  description: File payload to conceal. Max 50 MB (1 MB operational ceiling for carriers > 4 MP).
                text:
                  type: string
                  description: Plain text payload to conceal (if file is omitted).
                mode:
                  type: string
                  enum: [encrypted, plain, auto]
                  default: encrypted
                  description: Operating mode. Encrypted requires password; Plain prohibits password.
                password:
                  type: string
                  minLength: 8
                  description: Passphrase for PBKDF2 (600,000 iter) key derivation in encrypted mode. Strictly prohibited in plain mode.
      responses:
        '200':
          description: Payload embedded successfully using V6 engine
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: File hidden successfully using V6 engine
                  download_id:
                    type: string
                    example: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d.png
                  mode:
                    type: string
                    example: encrypted
                  metadata:
                    type: object
                    properties:
                      engine:
                        type: string
                        example: v6
                      triplets_used:
                        type: integer
                        example: 15420
                      rs_blocks:
                        type: integer
                        example: 15
                      mode:
                        type: string
                        example: encrypted
        '400':
          description: Validation error, password mismatch, or payload exceeds capacity

  /extract-v6:
    post:
      summary: Extract File from V6 Stego Image
      description: Dedicated V6 extraction endpoint. Performs Feistel coordinate inversion, Reed-Solomon de-interleaving, CRC-32 / Fernet authentication, and mode-downgrade prevention.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Stego image containing V6 payload.
                password:
                  type: string
                  description: Passphrase (required if carrier was embedded in encrypted mode).
                mode:
                  type: string
                  enum: [auto, encrypted, plain]
                  default: auto
                  description: Expected mode.
      responses:
        '200':
          description: Extracted file stream
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="confidential.pdf"
            X-InvisioVault-Engine:
              schema:
                type: string
                example: v6
            X-InvisioVault-Mode:
              schema:
                type: string
                example: encrypted
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Extraction error, incorrect password, or corrupted carrier

  /extract:
    post:
      summary: Extract File from Stego Image (Automatic Multi-Engine Detection)
      description: Universal extraction endpoint. Automatically inspects initial carrier channel LSBs (`detect_stego_engine`) to identify the embedding engine (V6 or legacy V1–V5) and dispatches accordingly without manual version selection. Strictly prevents fallback from V6 to legacy engines upon failure.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Steganographic carrier image (PNG, JPG, BMP). Max 50 MB.
                password:
                  type: string
                  description: Passphrase (required if carrier was encrypted; rejected if V6 plain).
      responses:
        '200':
          description: Extracted secret file stream
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="secret.txt"
            X-InvisioVault-Engine:
              schema:
                type: string
                example: v6
            X-InvisioVault-Mode:
              schema:
                type: string
                example: encrypted
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Extraction failed, invalid password, or corrupted carrier

  /calculate-capacity:
    post:
      summary: Calculate Steganographic Capacity (Legacy)
      description: Legacy endpoint. Reads image dimensions directly from file headers to compute available LSB byte capacity under the legacy V4/V5 model.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Carrier image (PNG, JPG, BMP)
      responses:
        '200':
          description: Calculated capacity
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCapacityBytes:
                    type: integer
                    example: 1572864
                  totalCapacityFormatted:
                    type: string
                    example: 1.5 MB
        '400':
          description: Invalid image or missing file

  /hide:
    post:
      summary: Hide File in Image (Legacy LSB Steganography)
      description: Legacy embedding endpoint preserved for backward compatibility. Encodes a payload into carrier pixels using Sobel edge guidance, Reed-Solomon ECC, and PBKDF2 (480k) + Fernet encryption.
      deprecated: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Host carrier image (PNG, JPG, BMP). Max 10 MB.
                file:
                  type: string
                  format: binary
                  description: File payload to conceal. Max 50 MB.
                text:
                  type: string
                  description: Plain text payload to conceal (if file is omitted).
                password:
                  type: string
                  minLength: 8
                  description: Passphrase for PBKDF2 (480k iter) + Fernet encryption.
      responses:
        '200':
          description: Payload embedded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: File hidden successfully
                  download_id:
                    type: string
                    example: 9a7b3c2d4e5f6a7b8c9d0e1f2a3b4c5d.png

  /download/{download_id}:
    get:
      summary: Download Stego File
      description: Streams the processed steganographic image directly from disk storage without memory duplication.
      parameters:
        - name: download_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Processed steganographic image file stream
          content:
            image/png:
              schema:
                type: string
                format: binary

  /polyglot/create:
    post:
      summary: Create Polyglot File
      description: Merges a carrier file (image, PDF, audio, video) with a hidden payload into a dual-format file with in-memory ZIP offset patching.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - carrier
              properties:
                carrier:
                  type: string
                  format: binary
                  description: Visible host carrier file. Max 10 MB.
                file:
                  type: string
                  format: binary
                  description: Secret file to conceal within the carrier. Max 50 MB.
                payload:
                  type: string
                  format: binary
                  deprecated: true
                  description: "Legacy alias for `file`. Prefer `file`."
                password:
                  type: string
                  description: Optional passphrase for encrypted ZIP packaging.
      responses:
        '200':
          description: Polyglot file generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Polyglot file created successfully
                  download_id:
                    type: string
                    example: e4f5a6b71c2d3e4f5a6b7c8d9e0f1a2b.pdf

  /polyglot/download/{download_id}:
    get:
      summary: Download Polyglot File
      description: Streams the generated polyglot file directly from disk storage.
      parameters:
        - name: download_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dual-format polyglot file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /polyglot/extract:
    post:
      summary: Extract from Polyglot File
      description: Extracts embedded archive files from a dual-format polyglot carrier.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Polyglot file to extract from.
                polyglot:
                  type: string
                  format: binary
                  deprecated: true
                  description: "Legacy alias for `file`. Prefer `file`."
                password:
                  type: string
      responses:
        '200':
          description: Extracted secret file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /qr/generate:
    post:
      summary: Generate Stealth QR Code
      description: Generates a QR code with public data and a hidden secret embedded via Visual Module Steganography. Supports both application/json and multipart/form-data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - public_data
                - secret_text
              properties:
                public_data:
                  type: string
                  description: Visible URL or public message.
                  example: https://github.com/rolan-r-n-r/InvisioVault
                secret_text:
                  type: string
                  description: Confidential payload to hide within QR matrix modules.
                  example: Master encryption seed
                secret_message:
                  type: string
                  deprecated: true
                  description: "Legacy alias for `secret_text`. Prefer `secret_text`."
                password:
                  type: string
                  description: Optional passphrase for Fernet authenticated encryption (min 8 characters).
                method:
                  type: string
                  enum: [visual]
                  default: visual
                  description: Steganography mode (visual module embedding).
                mode:
                  type: string
                  deprecated: true
                  description: "Legacy alias for `method`. Prefer `method`."
                fg_color:
                  type: string
                  default: "#000000"
                  example: "#000000"
                dark_color:
                  type: string
                  deprecated: true
                  description: "Legacy alias for `fg_color`. Prefer `fg_color`."
                bg_color:
                  type: string
                  default: "#ffffff"
                  example: "#ffffff"
                light_color:
                  type: string
                  deprecated: true
                  description: "Legacy alias for `bg_color`. Prefer `bg_color`."
                scale:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
          multipart/form-data:
            schema:
              type: object
              required:
                - public_data
                - secret_text
              properties:
                public_data:
                  type: string
                secret_text:
                  type: string
                secret_message:
                  type: string
                  deprecated: true
                password:
                  type: string
                method:
                  type: string
                  enum: [visual]
                  default: visual
                mode:
                  type: string
                  deprecated: true
                fg_color:
                  type: string
                  default: "#000000"
                dark_color:
                  type: string
                  deprecated: true
                bg_color:
                  type: string
                  default: "#ffffff"
                light_color:
                  type: string
                  deprecated: true
                scale:
                  type: integer
                  default: 10
                logo:
                  type: string
                  format: binary
                  description: Optional logo image to composite into center of QR code.
      responses:
        '200':
          description: QR Code generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: QR code generated successfully
                  download_id:
                    type: string
                    example: d1c2b3a45e6f7a8b9c0d1e2f3a4b5c6d_qr.png

  /qr/download/{download_id}:
    get:
      summary: Download Generated QR Code Image
      description: Streams the generated QR barcode image directly from disk storage.
      parameters:
        - name: download_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PNG QR Code stream
          content:
            image/png:
              schema:
                type: string
                format: binary

  /qr/scan:
    post:
      summary: Scan & Extract QR Code
      description: Decodes visible public barcode data and recovers steganographically concealed payloads.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                password:
                  type: string
      responses:
        '200':
          description: Scanned and decrypted QR data
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_data:
                    type: string
                  secret_message:
                    type: string
                  mode:
                    type: string

  /qr/extract:
    post:
      summary: Extract Secret from Raw Decoded QR String
      description: Direct extraction endpoint for recovering secrets from pre-scanned QR strings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qr_text
              properties:
                qr_text:
                  type: string
                password:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_data:
                    type: string
                  secret_message:
                    type: string

  /qr/capacity:
    post:
      summary: Compute QR Code Capacity
      description: Computes maximum hidden steganographic capacity based on public data length.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - public_data
              properties:
                public_data:
                  type: string
                mode:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_secret_bytes:
                    type: integer
                  safe_recommended_bytes:
                    type: integer

  /qr/detect:
    post:
      summary: Fast Frame Detection for Camera Scanner
      description: High-speed barcode detection endpoint with in-memory SHA-256 deduplication cache.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detected:
                    type: boolean
                  text:
                    type: string
