[pytest]
testpaths = tests
# The default run is the fast smoke subset. Release-evidence matrices are opt-in:
#   pytest -m slow
addopts = -m "not slow"
# Treat warnings as errors to prevent cryptographic and runtime regressions,
# with justified suppressions for test-runner logging file handle recycling.
filterwarnings =
    error
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
# Long-running QR fixture matrix and fuzz sweeps. The default run keeps a fast
# subset as a smoke test; use `-m "not slow"` to force-skip or `-m slow` to run
# only the release-evidence matrix.
markers =
    slow: long-running QR fixture matrix / fuzz sweep (not release evidence on its own)
