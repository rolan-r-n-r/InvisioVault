        <h1>InvisioVault — Universal Polyglot &amp; Steganography Toolkit</h1>
        <p>InvisioVault is an advanced, privacy-first cybersecurity utility engineered by <a href="https://rolan-rnr.netlify.app/" style="color: #60a5fa;">Rolan (RNR)</a>. It provides covert file concealment across images, PDFs, media containers, and QR barcodes with zero visual distortion and authenticated Fernet encryption.</p>
        
        <h2>Available Cryptographic Tools &amp; Deep Links</h2>
        <ul>
          <li>
            <a href="/steganography" style="color: #60a5fa; font-weight: bold;">V6 Image Steganography Engine:</a>
            Embed files or encrypted text inside PNG, JPEG, and BMP pixels using Matrix (3,2) coset syndrome coding, 10-round Feistel permutation, and interleaved Reed-Solomon RS(255, 223). Features universal multi-engine extraction (V1–V6 auto-detection).
          </li>
          <li>
            <a href="/polyglot" style="color: #60a5fa; font-weight: bold;">Universal Polyglot Creator:</a>
            Generate dual-format carrier files (images, PDFs, MP3s, MP4s) with in-memory ZIP Central Directory and EOCD record offset patching.
          </li>
          <li>
            <a href="/qr-code" style="color: #60a5fa; font-weight: bold;">Stealth QR Code Steganography:</a>
            Create stealth QR codes containing clean public data for standard scanners and encrypted secrets embedded inside non-structural modules via Visual Steganography.
          </li>
          <li>
            <a href="/docs" style="color: #60a5fa; font-weight: bold;">Architecture &amp; Documentation Hub:</a>
            Explore cryptographic wire format specifications, threat models, and OpenAPI definitions.
          </li>
        </ul>

        <h2>Zero-Retention Security Guarantee</h2>
        <p>InvisioVault operates a strict zero-retention policy. Uploaded files and in-memory buffers are processed statelessly and unlinked immediately post-transmission. No user payload is ever permanently persisted on the server.</p>
